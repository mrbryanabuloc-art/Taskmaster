<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Sync To-Do List</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.7);
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full font-sans transition-colors duration-200">

    <div id="app" class="max-w-4xl mx-auto min-h-screen flex flex-col p-4 sm:p-6 lg:p-8">
        
        <!-- Header -->
        <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-indigo-600 dark:text-indigo-400"></i>
                    Family Task Hub
                </h1>
                <p id="current-date" class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1"></p>
            </div>
            
            <div class="flex items-center gap-2 self-start sm:self-auto">
                <!-- Sync Status / Key Modal Trigger -->
                <button id="sync-key-btn" title="Set Family Sync Key" class="flex items-center gap-2 px-3 py-1.5 text-xs sm:text-sm font-medium bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition">
                    <span id="sync-status-dot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <i class="fa-solid fa-users text-slate-500"></i>
                    <span id="sync-key-label" class="max-w-[120px] truncate">Family Sync</span>
                </button>

                <!-- Dark Mode Toggle -->
                <button id="theme-toggle" class="p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-lg transition" title="Toggle theme">
                    <i id="theme-toggle-dark-icon" class="fa-solid fa-moon text-lg hidden"></i>
                    <i id="theme-toggle-light-icon" class="fa-solid fa-sun text-lg"></i>
                </button>
            </div>
        </header>

        <!-- Dynamic Category Tabs Header -->
        <div class="relative mb-6">
            <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-2">
                <!-- Tab List Container -->
                <div id="tabs-container" class="flex items-center gap-2 overflow-x-auto custom-scrollbar pb-1 max-w-[calc(100%-80px)] sm:max-w-[calc(100%-100px)]">
                    <!-- Dynamic Tabs Inserted Here -->
                </div>

                <!-- Category Actions -->
                <div class="flex items-center gap-1 pl-2">
                    <button id="edit-cat-btn" title="Edit current tab" class="p-2 text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-lg transition">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </button>
                    <button id="delete-cat-btn" title="Delete current tab" class="p-2 text-slate-500 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-lg transition">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Task Input Section -->
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-3 sm:p-4 mb-6">
            <form id="add-task-form" class="flex items-center gap-2">
                <input type="text" id="task-input" placeholder="Add a new task..." required class="flex-1 bg-transparent px-3 py-2 text-sm sm:text-base focus:outline-none text-slate-800 dark:text-slate-100 placeholder-slate-400">
                <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">Add Task</span>
                </button>
            </form>
        </div>

        <!-- Filter Controls -->
        <div class="flex items-center justify-between mb-4 px-1 text-xs sm:text-sm text-slate-500 dark:text-slate-400">
            <div class="flex items-center gap-1 bg-slate-200 dark:bg-slate-800 p-1 rounded-lg">
                <button data-filter="all" class="filter-btn px-3 py-1 rounded-md font-medium transition bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm">All</button>
                <button data-filter="active" class="filter-btn px-3 py-1 rounded-md font-medium transition hover:text-slate-900 dark:hover:text-white">Active</button>
                <button data-filter="completed" class="filter-btn px-3 py-1 rounded-md font-medium transition hover:text-slate-900 dark:hover:text-white">Completed</button>
            </div>
            <span id="task-counter" class="font-medium">0 tasks remaining</span>
        </div>

        <!-- Task List -->
        <main class="flex-1">
            <div id="tasks-list" class="space-y-2">
                <!-- Dynamic Tasks Render Here -->
            </div>
        </main>

        <!-- Floating Action Button (+) to Add New Category -->
        <div class="fixed bottom-6 right-6 z-30">
            <button id="fab-add-category" class="flex items-center justify-center w-14 h-14 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full shadow-lg hover:shadow-indigo-500/30 transition-all transform hover:scale-105 active:scale-95" title="Add New Category">
                <i class="fa-solid fa-plus text-xl"></i>
            </button>
        </div>

        <!-- Category Modal (Create / Edit) -->
        <div id="category-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
            <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-200 dark:border-slate-700">
                <h3 id="modal-title" class="text-xl font-bold mb-4 text-slate-900 dark:text-white">Create New Category</h3>
                <form id="category-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Category Name</label>
                        <input type="text" id="cat-name-input" required placeholder="e.g. Home, Fitness, Ideas" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-slate-100">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Color Theme</label>
                        <div class="grid grid-cols-6 gap-2" id="color-selector">
                            <button type="button" data-color="indigo" class="w-8 h-8 rounded-full bg-indigo-500 ring-2 ring-offset-2 ring-indigo-500"></button>
                            <button type="button" data-color="emerald" class="w-8 h-8 rounded-full bg-emerald-500"></button>
                            <button type="button" data-color="amber" class="w-8 h-8 rounded-full bg-amber-500"></button>
                            <button type="button" data-color="rose" class="w-8 h-8 rounded-full bg-rose-500"></button>
                            <button type="button" data-color="purple" class="w-8 h-8 rounded-full bg-purple-500"></button>
                            <button type="button" data-color="sky" class="w-8 h-8 rounded-full bg-sky-500"></button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Icon</label>
                        <div class="grid grid-cols-6 gap-2 text-slate-600 dark:text-slate-300" id="icon-selector">
                            <button type="button" data-icon="fa-folder" class="p-2 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 flex justify-center items-center text-indigo-500"><i class="fa-solid fa-folder"></i></button>
                            <button type="button" data-icon="fa-briefcase" class="p-2 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 flex justify-center items-center"><i class="fa-solid fa-briefcase"></i></button>
                            <button type="button" data-icon="fa-cart-shopping" class="p-2 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 flex justify-center items-center"><i class="fa-solid fa-cart-shopping"></i></button>
                            <button type="button" data-icon="fa-heart" class="p-2 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 flex justify-center items-center"><i class="fa-solid fa-heart"></i></button>
                            <button type="button" data-icon="fa-star" class="p-2 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 flex justify-center items-center"><i class="fa-solid fa-star"></i></button>
                            <button type="button" data-icon="fa-house" class="p-2 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 flex justify-center items-center"><i class="fa-solid fa-house"></i></button>
                        </div>
                    </div>

                    <div class="flex justify-end gap-2 pt-4">
                        <button type="button" id="close-category-modal" class="px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition">Cancel</button>
                        <button type="submit" class="px-4 py-2 text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition shadow-sm">Save Category</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Sync Key Modal -->
        <div id="sync-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
            <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-200 dark:border-slate-700">
                <h3 class="text-xl font-bold mb-2 text-slate-900 dark:text-white">Family Sync Settings</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">Enter a shared secret key (e.g., <strong>smith-family-2026</strong>) on all your family's devices to sync tasks together in real time.</p>
                <form id="sync-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Family Key</label>
                        <input type="text" id="sync-key-input" required placeholder="our-family-list" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-slate-100">
                    </div>
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" id="close-sync-modal" class="px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition">Cancel</button>
                        <button type="submit" class="px-4 py-2 text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition shadow-sm">Connect Sync</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- Firebase App & Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Config Setup
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDemoKeyOnly_For_Public_Fallback",
            authDomain: "demo-app.firebaseapp.com",
            projectId: "demo-app",
            storageBucket: "demo-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:demo"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-todo-app';
        let syncKey = localStorage.getItem('family_sync_key') || 'default-family';
        
        let currentUser = null;
        let unsubscribeSync = null;

        // Default Categories
        let categories = JSON.parse(localStorage.getItem('todo_categories')) || [
            { id: 'personal', name: 'Personal', icon: 'fa-house', color: 'indigo' },
            { id: 'work', name: 'Work', icon: 'fa-briefcase', color: 'emerald' },
            { id: 'shopping', name: 'Shopping', icon: 'fa-cart-shopping', color: 'amber' }
        ];

        // Default Tasks
        let tasks = JSON.parse(localStorage.getItem('todo_tasks')) || [
            { id: 't1', categoryId: 'personal', text: 'Plan weekend trip', completed: false },
            { id: 't2', categoryId: 'work', text: 'Prepare weekly summary', completed: true },
            { id: 't3', categoryId: 'shopping', text: 'Buy groceries', completed: false }
        ];

        let activeCategoryId = categories[0]?.id || 'personal';
        let currentFilter = 'all';
        let editingCategoryId = null;
        let selectedModalColor = 'indigo';
        let selectedModalIcon = 'fa-folder';

        // DOM Element Cache
        const tabsContainer = document.getElementById('tabs-container');
        const tasksList = document.getElementById('tasks-list');
        const addTaskForm = document.getElementById('add-task-form');
        const taskInput = document.getElementById('task-input');
        const taskCounter = document.getElementById('task-counter');
        const currentDateEl = document.getElementById('current-date');
        
        const categoryModal = document.getElementById('category-modal');
        const categoryForm = document.getElementById('category-form');
        const catNameInput = document.getElementById('cat-name-input');
        const modalTitle = document.getElementById('modal-title');
        
        const syncModal = document.getElementById('sync-modal');
        const syncForm = document.getElementById('sync-form');
        const syncKeyInput = document.getElementById('sync-key-input');
        const syncKeyLabel = document.getElementById('sync-key-label');

        // Dark mode setup
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-toggle-dark-icon')?.classList.remove('hidden');
            document.getElementById('theme-toggle-light-icon')?.classList.add('hidden');
        }

        document.getElementById('theme-toggle').addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('theme-toggle-dark-icon').classList.toggle('hidden', !isDark);
            document.getElementById('theme-toggle-light-icon').classList.toggle('hidden', isDark);
        });

        // Initialize Firebase Authentication
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const userCredential = await signInWithCustomToken(auth, __initial_auth_token);
                    currentUser = userCredential.user;
                } else {
                    const userCredential = await signInAnonymously(auth);
                    currentUser = userCredential.user;
                }
                setupCloudSync();
            } catch (e) {
                console.warn('Authentication failed, defaulting to local storage mode:', e);
            }
        }

        // Setup Firestore Real-time listener
        function setupCloudSync() {
            if (!currentUser) return;
            if (unsubscribeSync) unsubscribeSync();

            syncKeyLabel.textContent = syncKey;

            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'sync_groups', syncKey);
            
            unsubscribeSync = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (Array.isArray(data.categories) && data.categories.length > 0) {
                        categories = data.categories;
                    }
                    if (Array.isArray(data.tasks)) {
                        tasks = data.tasks;
                    }
                    if (!categories.find(c => c.id === activeCategoryId)) {
                        activeCategoryId = categories[0]?.id || 'personal';
                    }
                    saveLocal();
                    renderCategories();
                    renderTasks();
                } else {
                    saveDataToCloud();
                }
            }, (err) => {
                console.warn('Sync snapshot fallback:', err);
            });
        }

        // Save data to cloud and local
        async function saveDataToCloud() {
            saveLocal();
            if (!currentUser) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'sync_groups', syncKey);
                await setDoc(docRef, {
                    categories: categories,
                    tasks: tasks,
                    updatedAt: Date.now()
                });
            } catch (err) {
                console.error('Failed to sync data to cloud:', err);
            }
        }

        function saveLocal() {
            localStorage.setItem('todo_categories', JSON.stringify(categories));
            localStorage.setItem('todo_tasks', JSON.stringify(tasks));
            localStorage.setItem('family_sync_key', syncKey);
        }

        // Render Date Header
        function renderDate() {
            if (currentDateEl) {
                const options = { weekday: 'long', month: 'short', day: 'numeric' };
                currentDateEl.textContent = new Date().toLocaleDateString(undefined, options);
            }
        }

        // Render Category Tabs
        function renderCategories() {
            tabsContainer.innerHTML = '';
            categories.forEach(cat => {
                const uncompletedCount = tasks.filter(t => t.categoryId === cat.id && !t.completed).length;
                const isActive = cat.id === activeCategoryId;

                const tabBtn = document.createElement('button');
                tabBtn.type = 'button';
                tabBtn.className = `flex items-center gap-2 px-3.5 py-2 rounded-lg font-medium text-sm transition-all whitespace-nowrap border ${
                    isActive 
                        ? 'bg-indigo-50 dark:bg-indigo-950/50 border-indigo-200 dark:border-indigo-800 text-indigo-600 dark:text-indigo-400 shadow-sm' 
                        : 'bg-transparent border-transparent text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'
                }`;

                tabBtn.innerHTML = `
                    <i class="fa-solid ${cat.icon || 'fa-folder'}"></i>
                    <span>${escapeHtml(cat.name)}</span>
                    <span class="ml-1 px-1.5 py-0.5 text-xs rounded-full ${
                        isActive 
                            ? 'bg-indigo-200 dark:bg-indigo-900 text-indigo-800 dark:text-indigo-200' 
                            : 'bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300'
                    }">${uncompletedCount}</span>
                `;

                tabBtn.addEventListener('click', () => {
                    activeCategoryId = cat.id;
                    renderCategories();
                    renderTasks();
                });

                tabsContainer.appendChild(tabBtn);
            });
        }

        // Render Tasks
        function renderTasks() {
            tasksList.innerHTML = '';

            const categoryTasks = tasks.filter(t => t.categoryId === activeCategoryId);
            const filteredTasks = categoryTasks.filter(t => {
                if (currentFilter === 'active') return !t.completed;
                if (currentFilter === 'completed') return t.completed;
                return true;
            });

            const remainingCount = categoryTasks.filter(t => !t.completed).length;
            taskCounter.textContent = `${remainingCount} task${remainingCount === 1 ? '' : 's'} remaining`;

            if (filteredTasks.length === 0) {
                tasksList.innerHTML = `
                    <div class="text-center py-12 bg-white dark:bg-slate-800 rounded-xl border border-dashed border-slate-200 dark:border-slate-700">
                        <i class="fa-solid fa-clipboard-check text-3xl text-slate-300 dark:text-slate-600 mb-2"></i>
                        <p class="text-slate-500 dark:text-slate-400 text-sm">No tasks in this view</p>
                    </div>
                `;
                return;
            }

            filteredTasks.forEach(task => {
                const item = document.createElement('div');
                item.className = `group flex items-center justify-between p-3.5 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700/80 shadow-sm transition-all hover:border-slate-300 dark:hover:border-slate-600 ${
                    task.completed ? 'opacity-60 bg-slate-50 dark:bg-slate-800/50' : ''
                }`;

                item.innerHTML = `
                    <div class="flex items-center gap-3 flex-1 min-w-0">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} data-id="${task.id}" class="toggle-task w-5 h-5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer">
                        <span class="text-sm sm:text-base text-slate-800 dark:text-slate-200 truncate ${task.completed ? 'line-through text-slate-400 dark:text-slate-500' : ''}">
                            ${escapeHtml(task.text)}
                        </span>
                    </div>
                    <button data-id="${task.id}" class="delete-task opacity-0 group-hover:opacity-100 p-1.5 text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 rounded-lg transition" title="Delete task">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;

                tasksList.appendChild(item);
            });

            // Bind check box toggles
            document.querySelectorAll('.toggle-task').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const taskId = e.target.dataset.id;
                    const task = tasks.find(t => t.id === taskId);
                    if (task) {
                        task.completed = e.target.checked;
                        renderTasks();
                        renderCategories();
                        saveDataToCloud();
                    }
                });
            });

            // Bind task delete buttons
            document.querySelectorAll('.delete-task').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const taskId = btn.currentTarget.dataset.id;
                    tasks = tasks.filter(t => t.id !== taskId);
                    renderTasks();
                    renderCategories();
                    saveDataToCloud();
                });
            });
        }

        // Add New Task
        addTaskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = taskInput.value.trim();
            if (!text) return;

            const newTask = {
                id: 'task_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
                categoryId: activeCategoryId,
                text: text,
                completed: false
            };

            tasks.push(newTask);
            taskInput.value = '';

            // Render instantly
            renderTasks();
            renderCategories();
            saveDataToCloud();
        });

        // Filter Controls
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('bg-white', 'dark:bg-slate-700', 'text-slate-900', 'dark:text-white', 'shadow-sm');
                    b.classList.add('hover:text-slate-900', 'dark:hover:text-white');
                });
                e.target.classList.add('bg-white', 'dark:bg-slate-700', 'text-slate-900', 'dark:text-white', 'shadow-sm');
                currentFilter = e.target.dataset.filter;
                renderTasks();
            });
        });

        // Floating (+) Button - Add Category
        document.getElementById('fab-add-category').addEventListener('click', () => {
            editingCategoryId = null;
            modalTitle.textContent = 'Create New Category';
            catNameInput.value = '';
            categoryModal.classList.remove('hidden');
        });

        // Edit Category Button
        document.getElementById('edit-cat-btn').addEventListener('click', () => {
            const currentCat = categories.find(c => c.id === activeCategoryId);
            if (!currentCat) return;
            editingCategoryId = currentCat.id;
            modalTitle.textContent = 'Edit Category';
            catNameInput.value = currentCat.name;
            categoryModal.classList.remove('hidden');
        });

        // Delete Category Button
        document.getElementById('delete-cat-btn').addEventListener('click', () => {
            if (categories.length <= 1) {
                alert('You must keep at least one category!');
                return;
            }
            if (confirm('Delete this category and all its tasks?')) {
                tasks = tasks.filter(t => t.categoryId !== activeCategoryId);
                categories = categories.filter(c => c.id !== activeCategoryId);
                activeCategoryId = categories[0].id;
                renderCategories();
                renderTasks();
                saveDataToCloud();
            }
        });

        // Color & Icon Pickers
        document.querySelectorAll('#color-selector button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#color-selector button').forEach(b => b.classList.remove('ring-2', 'ring-offset-2', 'ring-indigo-500'));
                e.currentTarget.classList.add('ring-2', 'ring-offset-2', 'ring-indigo-500');
                selectedModalColor = e.currentTarget.dataset.color;
            });
        });

        document.querySelectorAll('#icon-selector button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#icon-selector button').forEach(b => b.classList.remove('text-indigo-500'));
                e.currentTarget.classList.add('text-indigo-500');
                selectedModalIcon = e.currentTarget.dataset.icon;
            });
        });

        // Save Category Form Submit
        categoryForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = catNameInput.value.trim();
            if (!name) return;

            if (editingCategoryId) {
                const cat = categories.find(c => c.id === editingCategoryId);
                if (cat) {
                    cat.name = name;
                    cat.color = selectedModalColor;
                    cat.icon = selectedModalIcon;
                }
            } else {
                const newCat = {
                    id: 'cat_' + Date.now(),
                    name: name,
                    color: selectedModalColor,
                    icon: selectedModalIcon
                };
                categories.push(newCat);
                activeCategoryId = newCat.id;
            }

            categoryModal.classList.add('hidden');
            renderCategories();
            renderTasks();
            saveDataToCloud();
        });

        document.getElementById('close-category-modal').addEventListener('click', () => {
            categoryModal.classList.add('hidden');
        });

        // Sync Modal Trigger
        document.getElementById('sync-key-btn').addEventListener('click', () => {
            syncKeyInput.value = syncKey;
            syncModal.classList.remove('hidden');
        });

        document.getElementById('close-sync-modal').addEventListener('click', () => {
            syncModal.classList.add('hidden');
        });

        syncForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const key = syncKeyInput.value.trim().toLowerCase().replace(/\s+/g, '-');
            if (key) {
                syncKey = key;
                saveLocal();
                setupCloudSync();
                syncModal.classList.add('hidden');
            }
        });

        // Helper Utility
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Window Load Handler
        window.onload = function() {
            renderDate();
            renderCategories();
            renderTasks();
            initAuth();
        };
    </script>
</body>
</html>
